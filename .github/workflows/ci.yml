# minibox 后端 CI 流水线
# 触发：push 到 opencode 分支 + PR
name: CI

on:
  push:
    branches: [opencode]
  pull_request:
    branches: [opencode]

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 代码检查（go vet）
        run: go vet ./...

      - name: 测试（零 CGO，不启用 race）
        run: go test -count=1 ./...

      - name: 架构守护（模块 40：跨模块边界）
        run: |
          # 分层约束由 internal/arch 测试强制（domain 不依赖 infra/transport/app 等）
          go test -count=1 ./internal/arch/

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  audit:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
