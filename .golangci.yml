# golangci-lint 配置（v2 格式）
# minibox 后端静态检查规则
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - revive
    - misspell
    - gocritic
  exclusions:
    rules:
      # 保留编译期接口断言惯用法 `var _ Interface = x`
      - linters: [staticcheck]
        text: "QF1011"