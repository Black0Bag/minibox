# GoReleaser 配置（模块 42：跨平台单文件二进制发布）。
# 单文件二进制红线（PRD 1）：CGO_ENABLED=0 + trimpath，linux/darwin/windows × amd64/arm64。
# 用法：git tag v0.1.0 && git push origin v0.1.0（触发 release workflow）
version: 2

project_name: minibox

builds:
  - id: minibox
    main: ./cmd/minibox
    binary: minibox
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: minibox
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: 新功能
      regexp: '^feat'
      order: 0
    - title: 修复
      regexp: '^fix'
      order: 1
    - title: 其他
      order: 2

release:
  name_template: "minibox {{ .Version }}"
  header: |
    # minibox {{ .Version }}

    单文件二进制下载即运行（零 CGO、零外部依赖）。
  footer: |
    完整变更见 git log。
